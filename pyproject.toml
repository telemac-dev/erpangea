readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "celery>=5.6.3",
    "crispy-bootstrap5>=2026.9",
    "django>=6.0.8",
    "django-celery-beat>=2.9.0",
    "django-celery-results>=2.6.0",
    "django-crispy-forms>=2.7",
    "django-htmx>=1.29.0",
    "gunicorn>=26.2.0",
    "pillow>=12.3.0",
    "psycopg[binary,pool]>=3.3.6",
    "python-dotenv>=1.2.4",
    "redis>=8.1.0",
]
