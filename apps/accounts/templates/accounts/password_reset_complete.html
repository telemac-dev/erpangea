{% extends 'base.html' %}

{% block title %}Senha Atualizada - ERPangea{% endblock %}

{% block auth_content %}
<div class="d-flex align-items-center justify-content-center" style="min-height: 100vh; background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);">
    <div class="card card-custom p-4 shadow-lg text-center" style="width: 100%; max-width: 440px; border: none;">
        <div class="d-inline-flex p-3 rounded-circle bg-success bg-opacity-10 text-success mb-3 mx-auto">
            <i class="bi bi-shield-check fs-1"></i>
        </div>
        <h4 class="fw-bold text-dark mb-2">Senha Redefinida!</h4>
        <p class="text-muted small mb-4">
            Sua senha corporativa foi atualizada com sucesso. Você já pode se autenticar utilizando suas novas credenciais.
        </p>
        <a href="{% url 'accounts:login' %}" class="btn btn-primary w-100 py-2 fw-semibold">
            <i class="bi bi-box-arrow-in-right me-1"></i> Acessar Sistema
        </a>
    </div>
</div>
{% endblock %}
