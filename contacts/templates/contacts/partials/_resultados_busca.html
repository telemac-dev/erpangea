{% for contact in contacts %}
    {% include 'contacts/partials/_contato_row.html' with contact=contact %}
{% empty %}
    <tr>
        <td colspan="7" class="px-6 py-12 text-center text-gray-500">
            <svg class="w-12 h-12 text-gray-300 mx-auto mb-3" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M17 20h5v-2a3 3 0 00-5.356-1.857M17 20H7m10 0v-2c0-.656-.126-1.283-.356-1.857M7 20H2v-2a3 3 0 015.356-1.857M7 20v-2c0-.656.126-1.283.356-1.857m0 0a5.002 5.002 0 019.288 0M15 7a3 3 0 11-6 0 3 3 0 016 0zm6 3a2 2 0 11-4 0 2 2 0 014 0zM7 10a2 2 0 11-4 0 2 2 0 014 0z"></path>
            </svg>
            <p class="text-base font-semibold text-gray-900">Nenhum contato encontrado</p>
            <p class="text-sm text-gray-500 mt-1">Comece cadastrando um novo cliente, fornecedor ou parceiro no ERPangea.</p>
            <div class="mt-4">
                <a href="{% url 'contact_create' %}" class="inline-flex items-center px-4 py-2 bg-indigo-600 hover:bg-indigo-700 text-white text-sm font-medium rounded-lg shadow-sm">
                    + Cadastrar Contato
                </a>
            </div>
        </td>
    </tr>
{% endfor %}
