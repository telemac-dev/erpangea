<div id="pessoa-fisica-fields" class="grid grid-cols-1 sm:grid-cols-2 gap-4 bg-gray-50 p-4 rounded-lg border border-gray-200">
    <div>
        <label class="block text-xs font-semibold text-gray-700 uppercase">RG</label>
        <input type="text" name="rg" value="{{ pf.rg|default:'' }}" class="mt-1 block w-full px-3 py-2 bg-white border border-gray-300 rounded-lg text-sm">
    </div>
    <div>
        <label class="block text-xs font-semibold text-gray-700 uppercase">Órgão Emissor / UF</label>
        <div class="flex gap-2">
            <input type="text" name="orgao_emissor_rg" value="{{ pf.orgao_emissor_rg|default:'' }}" placeholder="SSP" class="mt-1 block w-2/3 px-3 py-2 bg-white border border-gray-300 rounded-lg text-sm">
            <input type="text" name="uf_rg" value="{{ pf.uf_rg|default:'' }}" placeholder="SP" maxlength="2" class="mt-1 block w-1/3 px-3 py-2 bg-white border border-gray-300 rounded-lg text-sm uppercase">
        </div>
    </div>
    <div>
        <label class="block text-xs font-semibold text-gray-700 uppercase">Profissão</label>
        <input type="text" name="profissao" value="{{ pf.profissao|default:'' }}" placeholder="Ex: Engenheiro Civil" class="mt-1 block w-full px-3 py-2 bg-white border border-gray-300 rounded-lg text-sm">
    </div>
    <div>
        <label class="block text-xs font-semibold text-gray-700 uppercase">Conselho / Registro Profissional</label>
        <div class="flex gap-2">
            <input type="text" name="conselho_profissional" value="{{ pf.conselho_profissional|default:'' }}" placeholder="CREA" class="mt-1 block w-1/3 px-3 py-2 bg-white border border-gray-300 rounded-lg text-sm">
            <input type="text" name="registro_profissional" value="{{ pf.registro_profissional|default:'' }}" placeholder="Reg. 12345" class="mt-1 block w-2/3 px-3 py-2 bg-white border border-gray-300 rounded-lg text-sm">
        </div>
    </div>
</div>
