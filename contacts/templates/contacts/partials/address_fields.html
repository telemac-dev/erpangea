<div id="address-fields-container" class="space-y-6">
    <div class="border-t border-b border-gray-200 py-4 my-6">
        <h2 class="text-lg font-bold text-gray-900">Endereço</h2>
        <p class="text-xs text-gray-500">Informe o CEP para preenchimento automático via ViaCEP no evento on-blur.</p>
    </div>

    <div class="grid grid-cols-1 sm:grid-cols-3 gap-6">
        <div>
            <label for="id_zip_code" class="block text-sm font-medium text-gray-700">
                CEP (Opcional)
            </label>
            <input type="text" name="zip_code" id="id_zip_code"
                   value="{{ zip_code|default:'' }}" placeholder="00000-000"
                   hx-post="{% url 'lookup_cep_hx' %}"
                   hx-trigger="blur"
                   hx-target="#address-fields-container"
                   hx-swap="outerHTML"
                   hx-include="#id_address, #id_city, #id_state"
                   class="mt-1 block w-full px-3 py-2 bg-white border {% if error_msg %}border-red-500{% else %}border-gray-300{% endif %} rounded-lg text-sm focus:outline-none focus:border-indigo-500">
            {% if error_msg %}
                <p class="mt-1 text-xs text-red-600 font-semibold">{{ error_msg }}</p>
            {% endif %}
        </div>

        <div class="sm:col-span-2">
            <label for="id_address" class="block text-sm font-medium text-gray-700">
                Logradouro / Número / Bairro
            </label>
            <input type="text" name="address" id="id_address"
                   value="{{ address|default:'' }}"
                   class="mt-1 block w-full px-3 py-2 bg-white border border-gray-300 rounded-lg text-sm focus:outline-none focus:border-indigo-500">
        </div>

        <div>
            <label for="id_city" class="block text-sm font-medium text-gray-700">
                Cidade
            </label>
            <input type="text" name="city" id="id_city"
                   value="{{ city|default:'' }}"
                   class="mt-1 block w-full px-3 py-2 bg-white border border-gray-300 rounded-lg text-sm focus:outline-none focus:border-indigo-500">
        </div>

        <div>
            <label for="id_state" class="block text-sm font-medium text-gray-700">
                UF (Estado)
            </label>
            <input type="text" name="state" id="id_state" maxlength="2"
                   value="{{ state|default:'' }}" placeholder="EX: SP"
                   class="mt-1 block w-full px-3 py-2 bg-white border border-gray-300 rounded-lg text-sm uppercase focus:outline-none focus:border-indigo-500">
        </div>
    </div>
</div>
