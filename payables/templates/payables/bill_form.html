{% extends 'base_app.html' %}

{% block title %}{{ title }} | MeuERP{% endblock %}
{% block header_title %}{{ title }}{% endblock %}

{% block content %}
<div class="max-w-4xl mx-auto space-y-6">

    <div class="flex items-center justify-between">
        <a href="{% url 'bill_list' %}" class="text-sm font-medium text-gray-600 hover:text-gray-900 inline-flex items-center gap-1">
            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"></path>
            </svg>
            Voltar para contas a pagar
        </a>
    </div>

    <form method="post" enctype="multipart/form-data" class="bg-white rounded-xl border border-gray-200 shadow-sm p-6 sm:p-8 space-y-6">
        {% csrf_token %}

        <div class="grid grid-cols-1 sm:grid-cols-3 gap-6">
            
            <div>
                <label for="{{ form.bill_number.id_for_label }}" class="block text-sm font-medium text-gray-700">Número da NF / Boleto / Doc *</label>
                <input type="text" name="{{ form.bill_number.html_name }}" id="{{ form.bill_number.id_for_label }}"
                       value="{{ form.bill_number.value|default:'' }}" required
                       class="mt-1 block w-full px-3 py-2 bg-white border border-gray-300 rounded-lg text-sm focus:outline-none focus:border-indigo-500 font-bold" placeholder="Ex: NF-5542 ou Boleto-001">
            </div>

            <div class="sm:col-span-2">
                <label for="{{ form.supplier.id_for_label }}" class="block text-sm font-medium text-gray-700">Fornecedor / Favorecido *</label>
                <select name="{{ form.supplier.html_name }}" id="{{ form.supplier.id_for_label }}" required
                        class="mt-1 block w-full px-3 py-2 bg-white border border-gray-300 rounded-lg text-sm focus:outline-none focus:border-indigo-500 font-medium">
                    {% for choice_val, choice_label in form.fields.supplier.choices %}
                    <option value="{{ choice_val }}" {% if form.supplier.value|slugify == choice_val|slugify %}selected{% endif %}>{{ choice_label }}</option>
                    {% endfor %}
                </select>
            </div>

            <div>
                <label for="{{ form.category.id_for_label }}" class="block text-sm font-medium text-gray-700">Categoria da Despesa</label>
                <select name="{{ form.category.html_name }}" id="{{ form.category.id_for_label }}"
                        class="mt-1 block w-full px-3 py-2 bg-white border border-gray-300 rounded-lg text-sm focus:outline-none focus:border-indigo-500">
                    {% for cat_val, cat_label in form.fields.category.choices %}
                    <option value="{{ cat_val }}" {% if form.category.value == cat_val %}selected{% endif %}>{{ cat_label }}</option>
                    {% endfor %}
                </select>
            </div>

            <div class="sm:col-span-2">
                <label for="{{ form.project.id_for_label }}" class="block text-sm font-medium text-gray-700">Projeto (Apropriação de Custo Opcional)</label>
                <select name="{{ form.project.html_name }}" id="{{ form.project.id_for_label }}"
                        class="mt-1 block w-full px-3 py-2 bg-white border border-gray-300 rounded-lg text-sm focus:outline-none focus:border-indigo-500">
                    {% for choice_val, choice_label in form.fields.project.choices %}
                    <option value="{{ choice_val }}" {% if form.project.value|slugify == choice_val|slugify %}selected{% endif %}>{{ choice_label }}</option>
                    {% endfor %}
                </select>
            </div>

            <!-- Datas -->
            <div>
                <label for="{{ form.issue_date.id_for_label }}" class="block text-sm font-medium text-gray-700">Data de Emissão *</label>
                <input type="date" name="{{ form.issue_date.html_name }}" id="{{ form.issue_date.id_for_label }}"
                       value="{{ form.issue_date.value|date:'Y-m-d'|default:'' }}" required
                       class="mt-1 block w-full px-3 py-2 bg-white border border-gray-300 rounded-lg text-sm focus:outline-none focus:border-indigo-500">
            </div>

            <div>
                <label for="{{ form.due_date.id_for_label }}" class="block text-sm font-medium text-gray-700">Data de Vencimento *</label>
                <input type="date" name="{{ form.due_date.html_name }}" id="{{ form.due_date.id_for_label }}"
                       value="{{ form.due_date.value|date:'Y-m-d'|default:'' }}" required
                       class="mt-1 block w-full px-3 py-2 bg-white border border-gray-300 rounded-lg text-sm focus:outline-none focus:border-indigo-500">
            </div>

            <div>
                <label for="{{ form.status.id_for_label }}" class="block text-sm font-medium text-gray-700">Status do Pagamento</label>
                <select name="{{ form.status.html_name }}" id="{{ form.status.id_for_label }}"
                        class="mt-1 block w-full px-3 py-2 bg-white border border-gray-300 rounded-lg text-sm focus:outline-none focus:border-indigo-500 font-semibold">
                    {% for st_val, st_label in form.fields.status.choices %}
                    <option value="{{ st_val }}" {% if form.status.value == st_val %}selected{% endif %}>{{ st_label }}</option>
                    {% endfor %}
                </select>
            </div>

            <!-- Valores -->
            <div>
                <label for="{{ form.amount.id_for_label }}" class="block text-sm font-medium text-gray-700">Valor a Pagar (R$) *</label>
                <input type="number" step="0.01" name="{{ form.amount.html_name }}" id="{{ form.amount.id_for_label }}"
                       value="{{ form.amount.value|default:'' }}" required
                       class="mt-1 block w-full px-3 py-2 bg-white border border-gray-300 rounded-lg text-sm focus:outline-none focus:border-indigo-500 font-bold">
            </div>

            <div>
                <label for="{{ form.amount_paid.id_for_label }}" class="block text-sm font-medium text-gray-700">Valor Pago (R$)</label>
                <input type="number" step="0.01" name="{{ form.amount_paid.html_name }}" id="{{ form.amount_paid.id_for_label }}"
                       value="{{ form.amount_paid.value|default:0.00 }}"
                       class="mt-1 block w-full px-3 py-2 bg-white border border-gray-300 rounded-lg text-sm focus:outline-none focus:border-indigo-500">
            </div>

            <div class="sm:col-span-3">
                <label for="{{ form.bill_file.id_for_label }}" class="block text-sm font-medium text-gray-700">Anexo do Documento / Nota Fiscal / Boleto (PDF ou Imagem)</label>
                <input type="file" name="{{ form.bill_file.html_name }}" id="{{ form.bill_file.id_for_label }}"
                       class="mt-1 block w-full text-sm text-gray-500 file:mr-4 file:py-2 file:px-4 file:rounded-lg file:border-0 file:text-sm file:font-semibold file:bg-indigo-50 file:text-indigo-700 hover:file:bg-indigo-100">
            </div>

            <div class="sm:col-span-3">
                <label for="{{ form.notes.id_for_label }}" class="block text-sm font-medium text-gray-700">Observações / Histórico de Compliance</label>
                <textarea name="{{ form.notes.html_name }}" id="{{ form.notes.id_for_label }}" rows="3"
                          class="mt-1 block w-full px-3 py-2 bg-white border border-gray-300 rounded-lg text-sm focus:outline-none focus:border-indigo-500"></textarea>
            </div>

        </div>

        <div class="border-t border-gray-200 pt-6 flex justify-end gap-3">
            <a href="{% url 'bill_list' %}" class="px-4 py-2 bg-white border border-gray-300 text-gray-700 rounded-lg text-sm font-medium hover:bg-gray-50">Cancelar</a>
            <button type="submit" class="px-6 py-2 bg-indigo-600 hover:bg-indigo-700 text-white rounded-lg text-sm font-medium shadow-sm">Salvar Conta a Pagar</button>
        </div>

    </form>
</div>
{% endblock %}
