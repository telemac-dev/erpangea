{% comment %}
Componente Reutilizável: Botão (Tailwind CSS)
Uso: {% include 'components/_button.html' with label="Salvar" type="submit" variant="primary" %}
{% endcomment %}
<button type="{{ type|default:'button' }}"
        {% if id %}id="{{ id }}"{% endif %}
        {% if hx_get %}hx-get="{{ hx_get }}"{% endif %}
        {% if hx_post %}hx-post="{{ hx_post }}"{% endif %}
        {% if hx_target %}hx-target="{{ hx_target }}"{% endif %}
        {% if hx_swap %}hx-swap="{{ hx_swap }}"{% endif %}
        {% if hx_trigger %}hx-trigger="{{ hx_trigger }}"{% endif %}
        {% if disabled %}disabled{% endif %}
        class="inline-flex items-center justify-center gap-2 px-4 py-2 text-sm font-medium rounded-lg shadow-sm transition-colors focus:outline-none focus:ring-2 focus:ring-offset-2
        {% if variant == 'danger' %}bg-red-600 hover:bg-red-700 text-white focus:ring-red-500
        {% elif variant == 'secondary' %}bg-white border border-gray-300 text-gray-700 hover:bg-gray-50 focus:ring-indigo-500
        {% elif variant == 'slate' %}bg-slate-900 hover:bg-slate-800 text-white focus:ring-slate-700
        {% else %}bg-indigo-600 hover:bg-indigo-700 text-white focus:ring-indigo-500{% endif %} {{ extra_classes }}">
    {% if icon_svg %}{{ icon_svg|safe }}{% endif %}
    <span>{{ label }}</span>
</button>
