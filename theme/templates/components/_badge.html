{% comment %}
Componente Reutilizável: Badge (Tailwind CSS)
Uso: {% include 'components/_badge.html' with text="Ativo" variant="success" %}
{% endcomment %}
<span class="inline-flex items-center gap-1.5 px-2.5 py-0.5 rounded-full text-xs font-semibold
      {% if variant == 'success' %}bg-green-50 text-green-700 border border-green-200
      {% elif variant == 'danger' %}bg-red-50 text-red-700 border border-red-200
      {% elif variant == 'warning' %}bg-amber-50 text-amber-700 border border-amber-200
      {% elif variant == 'info' %}bg-blue-50 text-blue-700 border border-blue-200
      {% elif variant == 'purple' %}bg-purple-50 text-purple-700 border border-purple-200
      {% else %}bg-gray-100 text-gray-700 border border-gray-200{% endif %} {{ extra_classes }}">
    {% if dot %}
        <span class="w-1.5 h-1.5 rounded-full {% if variant == 'success' %}bg-green-600{% elif variant == 'danger' %}bg-red-600{% else %}bg-gray-500{% endif %}"></span>
    {% endif %}
    {{ text }}
</span>
