{% load static tailwind_tags %}
<!DOCTYPE html>
<html lang="pt-br">
<head>
    <title>{% block title %}ERPangea | Pangea Engenharia{% endblock %}</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    {% tailwind_css %}
    <script src="https://unpkg.com/htmx.org@1.9.10"></script>

<body class="bg-gray-100 text-gray-900 font-sans min-h-screen flex flex-col antialiased">

    {% if messages %}
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 w-full mt-4">
        {% for message in messages %}
        <div class="p-4 mb-4 text-sm rounded-lg flex justify-between items-center {% if message.tags == 'error' %}bg-red-100 text-red-700 border border-red-200{% elif message.tags == 'success' %}bg-green-100 text-green-700 border border-green-200{% else %}bg-blue-100 text-blue-700 border border-blue-200{% endif %}">
            <span>{{ message }}</span>
        </div>
        {% endfor %}
    </div>
    {% endif %}

    <main class="flex-grow flex items-center justify-center">
        {% block content %}{% endblock %}
    </main>

</body>
</html>
