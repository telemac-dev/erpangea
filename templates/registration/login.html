<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Login - ERPangea</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <style>
        body { background-color: #f4f6f9; height: 100vh; display: flex; align-items: center; justify-content: center; }
        .login-card { border: none; border-radius: 12px; box-shadow: 0 10px 30px rgba(0,0,0,0.08); overflow: hidden; width: 100%; max-width: 450px; }
        .login-header { background-color: #212529; color: white; padding: 30px; text-align: center; }
        .login-body { padding: 40px; background-color: white; }
        .form-control:focus { box-shadow: none; border-color: #212529; }
    </style>
</head>
<body>
    <div class="login-card">
        <div class="login-header">
            <i class="bi bi-globe-americas display-4 mb-3"></i>
            <h3>ERPangea</h3>
            <p class="mb-0 text-secondary">Pangea Engenharia Ltda</p>
        </div>
        <div class="login-body">
            {% if form.errors %}
                <div class="alert alert-danger p-2 mb-4">
                    <small>E-mail ou senha incorretos. Tente novamente.</small>
                </div>
            {% endif %}
            
            <form method="post" action="{% url 'login' %}">
                {% csrf_token %}
                <div class="mb-3">
                    <label class="form-label text-muted fw-bold small">E-MAIL CORPORATIVO</label>
                    <div class="input-group">
                        <span class="input-group-text bg-light border-end-0"><i class="bi bi-envelope"></i></span>
                        <input type="email" name="username" class="form-control border-start-0 bg-light" required autofocus placeholder="voce@pangea.com">
                    </div>
                </div>
                <div class="mb-4">
                    <label class="form-label text-muted fw-bold small">SENHA DE ACESSO</label>
                    <div class="input-group">
                        <span class="input-group-text bg-light border-end-0"><i class="bi bi-lock"></i></span>
                        <input type="password" name="password" class="form-control border-start-0 bg-light" required placeholder="••••••••">
                    </div>
                </div>
                <button type="submit" class="btn btn-dark w-100 py-2 fw-bold">Entrar no Sistema</button>
            </form>
        </div>
    </div>
</body>
</html>
