<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}ERPangea - Pangea Engenharia{% endblock %}</title>
    <!-- Bootstrap 5 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <!-- HTMX -->
    <script src="https://unpkg.com/htmx.org@1.9.10"></script>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #f4f6f9; }
        .sidebar { min-height: 100vh; background-color: #212529; color: #fff; }
        .sidebar a { color: #adb5bd; text-decoration: none; padding: 12px 20px; display: block; border-radius: 4px; margin-bottom: 5px; }
        .sidebar a:hover, .sidebar a.active { background-color: #343a40; color: #fff; }
        .sidebar i { margin-right: 10px; }
        .content { padding: 30px; }
        .navbar-custom { background-color: #fff; box-shadow: 0 2px 4px rgba(0,0,0,.04); }
        .card-stat { border: none; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,.05); transition: transform .2s; }
        .card-stat:hover { transform: translateY(-3px); }
    </style>
</head>
<body hx-headers='{"X-CSRFToken": "{{ csrf_token }}"}'>
    <div class="d-flex">
        <!-- Sidebar -->
        <div class="sidebar flex-shrink-0 p-3" style="width: 260px;">
            <a href="/" class="d-flex align-items-center mb-4 text-white text-decoration-none">
                <i class="bi bi-globe-americas fs-3 me-2"></i>
                <span class="fs-4 fw-bold">ERPangea</span>
            </a>
            <hr class="border-secondary">
            <ul class="nav nav-pills flex-column mb-auto">
                <li class="nav-item">
                    <a href="/" class="nav-link text-white"><i class="bi bi-speedometer2"></i> Dashboard</a>
                </li>
                <li>
                    <a href="/contacts/" class="nav-link text-white"><i class="bi bi-people"></i> Contatos Base</a>
                </li>
                <li>
                    <a href="/commercial/proposals/" class="nav-link text-white"><i class="bi bi-briefcase"></i> Gestão Comercial</a>
                </li>
                <li>
                    <a href="/projects/" class="nav-link text-white"><i class="bi bi-kanban"></i> Projetos & Tarefas</a>
                </li>
                <li>
                    <a href="/edms/" class="nav-link text-white"><i class="bi bi-file-earmark-pdf"></i> Repositório EDMS</a>
                </li>
                <li>
                    <a href="/measurements/" class="nav-link text-white"><i class="bi bi-rulers"></i> Medições</a>
                </li>
                <li>
                    <a href="/invoices/" class="nav-link text-white"><i class="bi bi-receipt"></i> Faturamento (NFS-e)</a>
                </li>
                <li>
                    <a href="/financial/" class="nav-link text-white"><i class="bi bi-wallet2"></i> Financeiro (Contas a Pagar)</a>
                </li>
            </ul>
        </div>

        <!-- Main Content -->
        <div class="flex-grow-1">
            <!-- Navbar -->
            <nav class="navbar navbar-expand-lg navbar-custom px-4 py-3 mb-4">
                <div class="container-fluid">
                    <span class="navbar-brand mb-0 h1">Sistema Integrado de Gestão Empresarial</span>
                    <div class="d-flex align-items-center">
                        <span class="me-3">Olá, <strong>{{ request.user.email }}</strong></span>
                        <form method="post" action="{% url 'logout' %}">
                            {% csrf_token %}
                            <button type="submit" class="btn btn-outline-danger btn-sm"><i class="bi bi-box-arrow-right"></i> Sair</button>
                        </form>
                    </div>
                </div>
            </nav>

            <!-- Dynamic Content -->
            <div class="content">
                {% block content %}{% endblock %}
            </div>
        </div>
    </div>

    <!-- Modal Container for HTMX -->
    <div class="modal fade" id="genericModal" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog modal-lg">
            <div class="modal-content" id="modal-container"></div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        // Fechar modal automaticamente após resposta de sucesso do HTMX
        document.body.addEventListener("htmx:afterSwap", function(event) {
            if (event.detail.target.id === 'modal-container') {
                // Configuração adicional se precisar após injetar modal
            }
        });
    </script>
    <script>
        document.body.addEventListener('htmx:configRequest', (event) => {
            event.detail.headers['X-CSRFToken'] = '{{ csrf_token }}';
        });
    </script>
</body>
</html>
