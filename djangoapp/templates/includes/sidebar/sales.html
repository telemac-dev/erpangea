<!-- Sales Section -->
{% if perms.sales.view_sale or perms.sales.view_customer %}
<div class="menu-section">
    <div class="menu-section-title">Vendas</div>
    
    {% if perms.sales.view_sale %}
    <div class="menu-item">
        <a href="#salesSubmenu" class="menu-link" data-bs-toggle="collapse" role="button" aria-expanded="false">
            <i class="bi bi-cart menu-icon"></i>
            <span class="menu-text">Vendas</span>
            <i class="bi bi-chevron-right menu-arrow ms-auto"></i>
        </a>
        <div class="collapse submenu" id="salesSubmenu">
            <a href="#" class="menu-link">
                <i class="bi bi-list-ul menu-icon"></i>
                <span class="menu-text">Lista de Vendas</span>
            </a>
            {% if perms.sales.add_sale %}
            <a href="#" class="menu-link">
                <i class="bi bi-plus-circle menu-icon"></i>
                <span class="menu-text">Nova Venda</span>
            </a>
            {% endif %}
            <a href="#" class="menu-link">
                <i class="bi bi-graph-up menu-icon"></i>
                <span class="menu-text">Relatórios</span>
            </a>
        </div>
    </div>
    {% endif %}

    {% if perms.sales.view_customer %}
    <div class="menu-item">
        <a href="#" class="menu-link">
            <i class="bi bi-people menu-icon"></i>
            <span class="menu-text">Clientes</span>
        </a>
    </div>
    {% endif %}
</div>
{% endif %}
