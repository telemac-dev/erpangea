<!-- Inventory Section -->
{% if perms.inventory.view_product %}
<div class="menu-section">
    <div class="menu-section-title">Estoque</div>
    
    <div class="menu-item">
        <a href="#inventorySubmenu" class="menu-link" data-bs-toggle="collapse" role="button" aria-expanded="false">
            <i class="bi bi-box-seam menu-icon"></i>
            <span class="menu-text">Produtos</span>
            <i class="bi bi-chevron-right menu-arrow ms-auto"></i>
        </a>
        <div class="collapse submenu" id="inventorySubmenu">
            <a href="#" class="menu-link">
                <i class="bi bi-list-ul menu-icon"></i>
                <span class="menu-text">Lista de Produtos</span>
            </a>
            {% if perms.inventory.add_product %}
            <a href="#" class="menu-link">
                <i class="bi bi-plus-circle menu-icon"></i>
                <span class="menu-text">Novo Produto</span>
            </a>
            {% endif %}
            <a href="#" class="menu-link">
                <i class="bi bi-tags menu-icon"></i>
                <span class="menu-text">Categorias</span>
            </a>
            <a href="#" class="menu-link">
                <i class="bi bi-boxes menu-icon"></i>
                <span class="menu-text">Controle de Estoque</span>
            </a>
        </div>
    </div>
</div>
{% endif %}
