{% load crispy_forms_tags %}
<div class="modal-header">
    <h5 class="modal-title"><i class="bi bi-plus-circle me-2 text-primary"></i>Criar Nova Tarefa</h5>
    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
</div>
<form hx-post="{% url 'projects:create_task_modal' %}" hx-target="#modal-container">
    {% csrf_token %}
    <div class="modal-body">
        <p class="text-muted small mb-3">Projeto: <strong>{{ project.nome_projeto }}</strong></p>
        {{ form|crispy }}
    </div>
    <div class="modal-footer">
        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
        <button type="submit" class="btn btn-primary"><i class="bi bi-save me-1"></i> Criar Tarefa</button>
    </div>
</form>
