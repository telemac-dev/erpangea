{% extends 'base.html' %}

{% block title %}Login | ERPangea - Pangea Engenharia{% endblock %}

{% block content %}
<div class="w-full max-w-md p-8 space-y-6 bg-white rounded-xl shadow-md border border-gray-200">
    <div class="text-center">
        <h1 class="text-3xl font-black tracking-tight text-indigo-600">ERPangea</h1>
        <p class="text-xs font-semibold text-gray-500 uppercase tracking-wider mt-0.5">Pangea Engenharia</p>
        <p class="mt-2 text-sm text-gray-600">Acesse sua conta para continuar</p>
    </div>

    <form method="post" class="mt-8 space-y-6">
        {% csrf_token %}
        <div class="space-y-4">
            <div>
                <label for="id_username" class="block text-sm font-medium text-gray-700">Usuário</label>

                <input type="text" name="username" id="id_username" required
                       class="mt-1 block w-full px-3 py-2 bg-white border border-gray-300 rounded-md text-sm shadow-sm placeholder-gray-400 focus:outline-none focus:border-indigo-500 focus:ring-1 focus:ring-indigo-500">
            </div>
            <div>
                <label for="id_password" class="block text-sm font-medium text-gray-700">Senha</label>

                <input type="password" name="password" id="id_password" required
                       class="mt-1 block w-full px-3 py-2 bg-white border border-gray-300 rounded-md text-sm shadow-sm placeholder-gray-400 focus:outline-none focus:border-indigo-500 focus:ring-1 focus:ring-indigo-500">
            </div>
        </div>

        <div>
            <button type="submit"
                    class="w-full flex justify-center py-2.5 px-4 border border-transparent rounded-md shadow-sm text-sm font-medium text-white bg-indigo-600 hover:bg-indigo-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-indigo-500 transition-colors">
                Entrar
            </button>
        </div>
    </form>

    <div class="text-center text-sm">
        <span class="text-gray-600">Ainda não tem uma conta?</span>
        <a href="{% url 'register' %}" class="font-medium text-indigo-600 hover:text-indigo-500 ml-1">Criar conta</a>
    </div>
</div>
{% endblock %}
