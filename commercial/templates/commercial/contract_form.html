{% extends 'base_app.html' %}

{% block title %}{{ title }} | MeuERP{% endblock %}
{% block header_title %}{{ title }}{% endblock %}

{% block content %}
<div class="max-w-4xl mx-auto space-y-6">

    <div class="flex items-center justify-between">
        <a href="{% url 'contract_list' %}" class="text-sm font-medium text-gray-600 hover:text-gray-900 inline-flex items-center gap-1">
            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"></path>
            </svg>
            Voltar para contratos
        </a>
    </div>

    <form method="post" class="bg-white rounded-xl border border-gray-200 shadow-sm p-6 sm:p-8 space-y-6">
        {% csrf_token %}

        <div class="grid grid-cols-1 sm:grid-cols-3 gap-6">
            <div>
                <label for="{{ form.number.id_for_label }}" class="block text-sm font-medium text-gray-700">Número do Contrato *</label>
                <input type="text" name="{{ form.number.html_name }}" id="{{ form.number.id_for_label }}"
                       value="{{ form.number.value|default:'' }}" required
                       class="mt-1 block w-full px-3 py-2 bg-white border border-gray-300 rounded-lg text-sm focus:outline-none focus:border-indigo-500 font-bold">
            </div>

            <div class="sm:col-span-2">
                <label for="{{ form.client.id_for_label }}" class="block text-sm font-medium text-gray-700">Cliente *</label>
                <select name="{{ form.client.html_name }}" id="{{ form.client.id_for_label }}" required
                        class="mt-1 block w-full px-3 py-2 bg-white border border-gray-300 rounded-lg text-sm focus:outline-none focus:border-indigo-500">
                    {% for choice_val, choice_label in form.fields.client.choices %}
                    <option value="{{ choice_val }}" {% if form.client.value|slugify == choice_val|slugify %}selected{% endif %}>{{ choice_label }}</option>
                    {% endfor %}
                </select>
            </div>

            <div class="sm:col-span-2">
                <label for="{{ form.proposal.id_for_label }}" class="block text-sm font-medium text-gray-700">Proposta de Origem (Opcional)</label>
                <select name="{{ form.proposal.html_name }}" id="{{ form.proposal.id_for_label }}"
                        class="mt-1 block w-full px-3 py-2 bg-white border border-gray-300 rounded-lg text-sm focus:outline-none focus:border-indigo-500">
                    {% for choice_val, choice_label in form.fields.proposal.choices %}
                    <option value="{{ choice_val }}" {% if form.proposal.value|slugify == choice_val|slugify %}selected{% endif %}>{{ choice_label }}</option>
                    {% endfor %}
                </select>
            </div>

            <div>
                <label for="{{ form.total_value.id_for_label }}" class="block text-sm font-medium text-gray-700">Valor Total (R$) *</label>
                <input type="number" step="0.01" name="{{ form.total_value.html_name }}" id="{{ form.total_value.id_for_label }}"
                       value="{{ form.total_value.value|default:'' }}" required
                       class="mt-1 block w-full px-3 py-2 bg-white border border-gray-300 rounded-lg text-sm focus:outline-none focus:border-indigo-500 font-bold">
            </div>

            <div>
                <label for="{{ form.start_date.id_for_label }}" class="block text-sm font-medium text-gray-700">Data de Início *</label>
                <input type="date" name="{{ form.start_date.html_name }}" id="{{ form.start_date.id_for_label }}"
                       value="{{ form.start_date.value|date:'Y-m-d'|default:'' }}" required
                       class="mt-1 block w-full px-3 py-2 bg-white border border-gray-300 rounded-lg text-sm focus:outline-none focus:border-indigo-500">
            </div>

            <div>
                <label for="{{ form.end_date.id_for_label }}" class="block text-sm font-medium text-gray-700">Data de Término</label>
                <input type="date" name="{{ form.end_date.html_name }}" id="{{ form.end_date.id_for_label }}"
                       value="{{ form.end_date.value|date:'Y-m-d'|default:'' }}"
                       class="mt-1 block w-full px-3 py-2 bg-white border border-gray-300 rounded-lg text-sm focus:outline-none focus:border-indigo-500">
            </div>

            <div>
                <label for="{{ form.readjustment_index.id_for_label }}" class="block text-sm font-medium text-gray-700">Índice de Reajuste</label>
                <input type="text" name="{{ form.readjustment_index.html_name }}" id="{{ form.readjustment_index.id_for_label }}"
                       value="{{ form.readjustment_index.value|default:'IPCA' }}" placeholder="Ex: IPCA, INCC, IGPM"
                       class="mt-1 block w-full px-3 py-2 bg-white border border-gray-300 rounded-lg text-sm focus:outline-none focus:border-indigo-500">
            </div>

            <div>
                <label for="{{ form.status.id_for_label }}" class="block text-sm font-medium text-gray-700">Status do Contrato</label>
                <select name="{{ form.status.html_name }}" id="{{ form.status.id_for_label }}"
                        class="mt-1 block w-full px-3 py-2 bg-white border border-gray-300 rounded-lg text-sm focus:outline-none focus:border-indigo-500">
                    {% for st_val, st_label in form.fields.status.choices %}
                    <option value="{{ st_val }}" {% if form.status.value == st_val %}selected{% endif %}>{{ st_label }}</option>
                    {% endfor %}
                </select>
            </div>

            <div>
                <label for="{{ form.responsible.id_for_label }}" class="block text-sm font-medium text-gray-700">Gestor do Contrato</label>
                <select name="{{ form.responsible.html_name }}" id="{{ form.responsible.id_for_label }}"
                        class="mt-1 block w-full px-3 py-2 bg-white border border-gray-300 rounded-lg text-sm focus:outline-none focus:border-indigo-500">
                    {% for choice_val, choice_label in form.fields.responsible.choices %}
                    <option value="{{ choice_val }}" {% if form.responsible.value|slugify == choice_val|slugify %}selected{% endif %}>{{ choice_label }}</option>
                    {% endfor %}
                </select>
            </div>

            <div class="sm:col-span-3">
                <label for="{{ form.payment_terms.id_for_label }}" class="block text-sm font-medium text-gray-700">Condições de Pagamento</label>
                <textarea name="{{ form.payment_terms.html_name }}" id="{{ form.payment_terms.id_for_label }}" rows="2"
                          class="mt-1 block w-full px-3 py-2 bg-white border border-gray-300 rounded-lg text-sm focus:outline-none focus:border-indigo-500"></textarea>
            </div>

            <div class="sm:col-span-3">
                <label for="{{ form.notes.id_for_label }}" class="block text-sm font-medium text-gray-700">Observações</label>
                <textarea name="{{ form.notes.html_name }}" id="{{ form.notes.id_for_label }}" rows="2"
                          class="mt-1 block w-full px-3 py-2 bg-white border border-gray-300 rounded-lg text-sm focus:outline-none focus:border-indigo-500"></textarea>
            </div>

        </div>

        <div class="border-t border-gray-200 pt-6 flex justify-end gap-3">
            <a href="{% url 'contract_list' %}" class="px-4 py-2 bg-white border border-gray-300 text-gray-700 rounded-lg text-sm font-medium hover:bg-gray-50">Cancelar</a>
            <button type="submit" class="px-6 py-2 bg-indigo-600 hover:bg-indigo-700 text-white rounded-lg text-sm font-medium shadow-sm">Salvar Contrato</button>
        </div>

    </form>
</div>
{% endblock %}
