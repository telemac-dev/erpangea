services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: erpangea
      POSTGRES_USER: pangea_user
      POSTGRES_PASSWORD: pangea_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  web:
    build: .
    command: uv run python manage.py runserver 0.0.0.0:8000
    volumes:
      - .:/app
    ports:
      - "8000:8000"
    environment:
      - POSTGRES_DB=erpangea
      - POSTGRES_USER=pangea_user
      - POSTGRES_PASSWORD=pangea_password
      - POSTGRES_HOST=db
      - POSTGRES_PORT=5432
    depends_on:
      - db

volumes:
  postgres_data:
