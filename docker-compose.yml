services:
  db:
    image: postgres:16-alpine
    container_name: erpangea_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-erpangea_v2}
      POSTGRES_USER: ${POSTGRES_USER:-pangea_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-pangea_secure_pass}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-pangea_user} -d ${POSTGRES_DB:-erpangea_v2}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - erpangea_net

  redis:
    image: redis:7-alpine
    container_name: erpangea_redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    ports:
      - "${REDIS_PORT:-6380}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - erpangea_net

  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: erpangea_web
    restart: unless-stopped
    command: /app/docker/scripts/start-web.sh
    volumes:
      - media_data:/app/media
    ports:
      - "8000:8000"
    environment:
      - POSTGRES_HOST=db
      - POSTGRES_PORT=5432
      - POSTGRES_DB=${POSTGRES_DB:-erpangea_v2}
      - POSTGRES_USER=${POSTGRES_USER:-pangea_user}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-pangea_secure_pass}
      - REDIS_HOST=redis
      - REDIS_URL=redis://redis:6379/1
      - CELERY_BROKER_URL=redis://redis:6379/0
      - ALLOWED_HOSTS=*
      - CSRF_TRUSTED_ORIGINS=http://192.168.10.250:8000,http://localhost:8000,http://127.0.0.1:8000
      - USE_SQLITE=False
      - ADMIN_EMAIL=admin@pangea.eng.br
      - ADMIN_PASSWORD=Pangea#2026
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - erpangea_net

  celery_worker:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: erpangea_worker
    restart: unless-stopped
    command: /app/docker/scripts/start-worker.sh
    volumes:
      - media_data:/app/media
    environment:
      - POSTGRES_HOST=db
      - POSTGRES_PORT=5432
      - POSTGRES_DB=${POSTGRES_DB:-erpangea_v2}
      - POSTGRES_USER=${POSTGRES_USER:-pangea_user}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-pangea_secure_pass}
      - REDIS_HOST=redis
      - REDIS_URL=redis://redis:6379/1
      - CELERY_BROKER_URL=redis://redis:6379/0
      - USE_SQLITE=False
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - erpangea_net

  celery_beat:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: erpangea_beat
    restart: unless-stopped
    command: /app/docker/scripts/start-beat.sh
    environment:
      - POSTGRES_HOST=db
      - POSTGRES_PORT=5432
      - POSTGRES_DB=${POSTGRES_DB:-erpangea_v2}
      - POSTGRES_USER=${POSTGRES_USER:-pangea_user}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-pangea_secure_pass}
      - REDIS_HOST=redis
      - REDIS_URL=redis://redis:6379/1
      - CELERY_BROKER_URL=redis://redis:6379/0
      - USE_SQLITE=False
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - erpangea_net

volumes:
  postgres_data:
    name: erpangea_postgres_data
  redis_data:
    name: erpangea_redis_data
  media_data:
    name: erpangea_media_data

networks:
  erpangea_net:
    name: erpangea_net
    driver: bridge
